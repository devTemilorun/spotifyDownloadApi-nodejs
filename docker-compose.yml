services:
  redis:
    image: redis:7-alpine
    container_name: spotify-downloader-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: spotify-downloader-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
    command: ["node", "dist/server.js"]

  worker:
    build: .
    container_name: spotify-downloader-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./temp:/app/temp
    command: ["node", "dist/queues/worker-entry.js"]

volumes:
  redis_data:
